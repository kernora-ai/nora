name: Nora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis pytest

      - name: Create kernora dirs
        run: |
          mkdir -p ~/.kernora/{logs,spool}
          cp config.toml.example ~/.kernora/config.toml

      - name: Test — DB init
        working-directory: kiro-extension/bundled
        run: python -c "from db import init_db; init_db(); print('DB init OK')"

      - name: Test — dashboard imports
        working-directory: kiro-extension/bundled
        run: python -c "import dashboard; print('dashboard imports OK')"

      - name: Test — analyzer imports
        working-directory: kiro-extension/bundled
        run: python -c "from analyzer import get_model_string, analyze, probe_local_llm; print('analyzer imports OK')"

      - name: Test — trace parser
        working-directory: kiro-extension/bundled
        run: python -c "from trace_parser import parse_traces; print('trace_parser OK')"

      - name: Test — score utils
        working-directory: kiro-extension/bundled
        run: python -c "from score_utils import compute_leverage; print('score_utils OK')"

      - name: Test — hook uses no external imports (Tenet 12)
        working-directory: kiro-extension/bundled
        run: |
          python -c "
          import ast, sys
          with open('hook.py') as f:
              tree = ast.parse(f.read())
          imports = [n.names[0].name for n in ast.walk(tree)
                     if isinstance(n, ast.Import)]
          from_imports = [n.module for n in ast.walk(tree)
                          if isinstance(n, ast.ImportFrom)]
          stdlib = {'json','sys','os','socket','pathlib','datetime',
                    'signal','threading','time','re','typing','hashlib',
                    'traceback','io','struct','http','urllib'}
          bad = [i for i in imports + from_imports
                 if i and i.split('.')[0] not in stdlib and i is not None]
          if bad:
              print(f'hook.py has non-stdlib imports: {bad}')
              sys.exit(1)
          print('hook.py: stdlib only — OK')
          "

      - name: Test — ELv2 headers present (all bundled Python files)
        run: |
          MISSING=()
          while IFS= read -r -d '' f; do
            grep -q "Elastic License 2.0" "$f" || MISSING+=("$f")
          done < <(find kiro-extension/bundled -maxdepth 1 -name "*.py" -print0)
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing ELv2 header in ${#MISSING[@]} file(s):"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          fi
          COUNT=$(find kiro-extension/bundled -maxdepth 1 -name "*.py" | wc -l | tr -d ' ')
          echo "ELv2 headers present in all $COUNT bundled Python files"

      - name: Test — integrity tests
        working-directory: kiro-extension/bundled
        run: python -m pytest test_integrity.py -v --tb=short || true

      # Hardening tests for 2026-05-11 modules. Hard gate (no || true) —
      # these are PE-verified clean today; regressions should fail CI.
      # Run from repo root (each script imports from root .py files).

      - name: Test — writing_voice (Anthropic-voice copywriting rules)
        run: python3 test_writing_voice.py

      - name: Test — code_health _suppressions loader
        run: python3 test_code_health_suppressions.py

      - name: Test — nora_provenance MCP method (universal-gap demo)
        run: python3 test_nora_provenance.py

      # E2E integration test — caught the CLAUDE.md wire-up gap that
      # isolated unit tests missed. Runs steering_writer.py and greps
      # each emitted file for required blocks + idempotency.
      - name: Test — steering emit e2e (catches wire-up gaps)
        run: python3 test_steering_emit_e2e.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python
        run: |
          # E501 line too long, W291 trailing whitespace, F401 unused import — style
          # E402 module-level imports not at top — intentional (lazy imports, Flask patterns)
          # E701 multiple statements on one line — used throughout for concision
          # F841 local variable assigned but never used — common in error-handling paths
          # E741 ambiguous variable name (l/O/I) — legacy shorthand, not a bug
          # E731 lambda assignment — used for simple callbacks
          ruff check kiro-extension/bundled/ \
            --ignore E501,W291,F401,E402,E701,F841,E741,E731 \
            --exclude __pycache__

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install extension deps
        working-directory: kiro-extension
        run: npm ci
      - name: Compile extension
        working-directory: kiro-extension
        run: npm run compile
      - name: Package VSIX
        working-directory: kiro-extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ./node_modules/.bin/vsce package --no-dependencies
          echo "VSIX_FILE=kernora-${VERSION}.vsix" >> $GITHUB_ENV
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernora-vsix-${{ github.sha }}
          path: kiro-extension/kernora-*.vsix
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    # Only runs on version tags — never on branch pushes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-python, lint, extension]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build VSIX for release
        working-directory: kiro-extension
        run: |
          npm ci
          npm run compile
          ./node_modules/.bin/vsce package --no-dependencies

      - name: Build full-bundle tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          STAGING=$(mktemp -d)

          # Copy all bundled Python files — exclude test_* and internal test helpers
          find kiro-extension/bundled -maxdepth 1 -name "*.py" \
            ! -name "test_*.py" \
            ! -name "*_test.py" \
            -exec cp {} "$STAGING/" \;

          # Copy kernora_sdk/ subdirectory (agent/pipeline/runtime modules)
          if [ -d "kiro-extension/bundled/kernora_sdk" ]; then
            cp -r kiro-extension/bundled/kernora_sdk "$STAGING/"
          fi

          # Core distribution files
          cp requirements.txt "$STAGING/"
          [ -f config.toml.example ] && cp config.toml.example "$STAGING/" || true

          # VERSION file (semver without leading 'v')
          echo "${VERSION#v}" > "$STAGING/VERSION"

          PY_COUNT=$(find "$STAGING" -maxdepth 1 -name "*.py" | wc -l | tr -d ' ')
          echo "Staging: $PY_COUNT Python files"

          # Build tarball — strip pycache, pyc, DS_Store
          TARBALL="kernora-${VERSION}-full.tar.gz"
          tar -czf "$TARBALL" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.DS_Store' \
            --exclude='.pytest_cache' \
            -C "$STAGING" .

          # sha256 sidecar
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

          ls -lh "$TARBALL" "${TARBALL}.sha256"
          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV

      - name: Verify tarball integrity
        env:
          TARBALL: ${{ env.TARBALL }}
        run: |
          echo "=== Contents ==="
          tar -tzf "$TARBALL" | sort | head -50
          echo "=== File count ==="
          tar -tzf "$TARBALL" | wc -l
          echo "=== Integrity checks ==="
          tar -tzf "$TARBALL" | grep -E "^test_" && echo "FAIL: test files in tarball" && exit 1 || true
          tar -tzf "$TARBALL" | grep "__pycache__" && echo "FAIL: pycache in tarball" && exit 1 || true
          tar -tzf "$TARBALL" | grep "requirements.txt" || (echo "FAIL: requirements.txt missing" && exit 1)
          tar -tzf "$TARBALL" | grep "^./VERSION" || (echo "FAIL: VERSION file missing" && exit 1)
          # kernora_publish.py is a dev/release-ops script only — it must NEVER
          # ship in the end-user tarball (no deps, no user data, wrong surface).
          if tar -tzf "$TARBALL" | grep -q "kernora_publish"; then
            echo "FAIL: kernora_publish found in release tarball — scripts/ must not be bundled"
            exit 1
          fi
          echo "All integrity checks passed"

      - name: Create GitHub release on kernora-ai/nora
        env:
          GH_TOKEN: ${{ secrets.NORA_RELEASE_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARBALL: ${{ env.TARBALL }}
        run: |
          VSIX=$(ls kiro-extension/kernora-*.vsix 2>/dev/null | head -1)
          gh release create "$VERSION" \
            "$TARBALL" \
            "${TARBALL}.sha256" \
            ${VSIX:+"$VSIX"} \
            --repo kernora-ai/nora \
            --title "Kernora ${VERSION}" \
            --notes "## Kernora ${VERSION}

Full commercial bundle — 170+ Python files including Dreamer, dashboard, MCP server, ROI engine, PE workflows, and all hooks.

### Install
\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/kernora-ai/nora/main/install.sh | bash
\`\`\`

### License
Elastic License 2.0 — free for personal use, commercial deployment requires agreement with kernora.ai"
