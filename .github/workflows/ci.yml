name: Kernora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create kernora dirs
        run: |
          mkdir -p ~/.kernora/{logs,spool}
          cp config.toml.example ~/.kernora/config.toml

      - name: Test — imports clean
        run: |
          python -c "import hook; import db; import analyzer; import notifier"

      - name: Test — daemon starts
        run: |
          timeout 3 python daemon.py || true
          # exits via timeout — that's expected

      - name: Test — hook handles empty stdin
        run: |
          echo '{}' | python hook.py

      - name: Test — hook handles real payload
        run: |
          echo '{"session_id":"ci-test-001","transcript_path":"","cwd":"/tmp"}' \
            | python hook.py 2>&1 | grep -q "hook received"

      - name: Test — DB init
        run: |
          python db.py 2>&1 | grep -q "DB"

      - name: Test — dashboard imports
        run: |
          python -c "import dashboard; print('ok')"

      - name: Test — config exists
        run: |
          cat ~/.kernora/config.toml | grep 'type = "byok"'

      - name: Test — ELv2 headers present
        run: |
          for f in hook.py daemon.py db.py analyzer.py notifier.py dashboard.py; do
            grep -q "Elastic License 2.0" $f || (echo "Missing ELv2 header: $f" && exit 1)
          done

      - name: Test — hook uses no external imports
        run: |
          python -c "
          import ast, sys
          with open('hook.py') as f:
              tree = ast.parse(f.read())
          imports = [n.names[0].name for n in ast.walk(tree)
                     if isinstance(n, ast.Import)]
          from_imports = [n.module for n in ast.walk(tree)
                          if isinstance(n, ast.ImportFrom)]
          stdlib = {'json','sys','os','socket','pathlib','datetime',
                    'signal','threading','time','re','typing'}
          bad = [i for i in imports + from_imports
                 if i and i.split('.')[0] not in stdlib and i is not None]
          if bad:
              print(f'hook.py has non-stdlib imports: {bad}')
              sys.exit(1)
          print('hook.py: stdlib only — OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check . --ignore E501,W291
