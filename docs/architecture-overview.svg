<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="ui-monospace, monospace" font-size="13">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0e1825"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2520"/>
      <stop offset="100%" stop-color="#0e1a15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#dce8f5" font-size="18" font-weight="600">Nora System Architecture</text>
  <text x="450" y="60" text-anchor="middle" fill="#6a8aaa" font-size="11">AI Work Intelligence — everything runs on your machine</text>

  <!-- Claw Layer -->
  <text x="50" y="100" fill="#1D9E75" font-size="12" font-weight="600">CLAWS (adapters)</text>

  <!-- Claude Claw -->
  <rect x="30" y="115" width="180" height="90" rx="8" fill="url(#clawGrad)" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="120" y="140" text-anchor="middle" fill="#1D9E75" font-size="13" font-weight="600">claude-claw</text>
  <text x="120" y="158" text-anchor="middle" fill="#8ab4a0" font-size="10">Claude Code plugin</text>
  <text x="120" y="175" text-anchor="middle" fill="#6a8aaa" font-size="10">Stop hook → JSONL reader</text>
  <text x="120" y="192" text-anchor="middle" fill="#6a8aaa" font-size="10">+ Skills + Agents</text>

  <!-- Kiro Claw -->
  <rect x="240" y="115" width="180" height="90" rx="8" fill="url(#clawGrad)" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="330" y="140" text-anchor="middle" fill="#1D9E75" font-size="13" font-weight="600">kiro-claw</text>
  <text x="330" y="158" text-anchor="middle" fill="#8ab4a0" font-size="10">VS Code extension</text>
  <text x="330" y="175" text-anchor="middle" fill="#6a8aaa" font-size="10">File watcher → parser</text>
  <text x="330" y="192" text-anchor="middle" fill="#6a8aaa" font-size="10">Extends vscode-claw</text>

  <!-- Cursor Claw -->
  <rect x="450" y="115" width="180" height="90" rx="8" fill="url(#clawGrad)" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="540" y="140" text-anchor="middle" fill="#1D9E75" font-size="13" font-weight="600">cursor-claw</text>
  <text x="540" y="158" text-anchor="middle" fill="#8ab4a0" font-size="10">VS Code extension</text>
  <text x="540" y="175" text-anchor="middle" fill="#6a8aaa" font-size="10">Coming soon</text>
  <text x="540" y="192" text-anchor="middle" fill="#6a8aaa" font-size="10">Extends vscode-claw</text>

  <!-- Your Claw -->
  <rect x="660" y="115" width="180" height="90" rx="8" fill="url(#clawGrad)" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="750" y="140" text-anchor="middle" fill="#1D9E75" font-size="13" font-weight="600">your-claw</text>
  <text x="750" y="158" text-anchor="middle" fill="#8ab4a0" font-size="10">Any format</text>
  <text x="750" y="175" text-anchor="middle" fill="#6a8aaa" font-size="10">Claw Protocol spec</text>
  <text x="750" y="192" text-anchor="middle" fill="#6a8aaa" font-size="10">~50 lines of code</text>

  <!-- VS Code Claw base (shared) -->
  <rect x="240" y="218" width="390" height="30" rx="6" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="3"/>
  <text x="435" y="238" text-anchor="middle" fill="#378ADD" font-size="10">vscode-claw (shared base: socket client, status bar, commands)</text>

  <!-- Arrows from claws to protocol -->
  <line x1="120" y1="205" x2="120" y2="272" stroke="#1D9E75" stroke-width="1.5"/>
  <line x1="330" y1="248" x2="330" y2="272" stroke="#1D9E75" stroke-width="1.5"/>
  <line x1="540" y1="248" x2="540" y2="272" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="750" y1="205" x2="750" y2="272" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Protocol Bar -->
  <rect x="30" y="272" width="810" height="32" rx="6" fill="#111a25" stroke="#378ADD" stroke-width="1.5"/>
  <text x="450" y="293" text-anchor="middle" fill="#378ADD" font-size="12" font-weight="600">Claw Protocol — Unix socket + JSON envelope (~/.kernora/nora.sock)</text>

  <!-- Arrow to engine -->
  <line x1="435" y1="304" x2="435" y2="340" stroke="#378ADD" stroke-width="2"/>
  <polygon points="430,340 440,340 435,350" fill="#378ADD"/>

  <!-- Nora Engine -->
  <text x="50" y="375" fill="#BA7517" font-size="12" font-weight="600">NORA ENGINE (agent-agnostic)</text>

  <rect x="30" y="390" width="810" height="220" rx="10" fill="url(#engineGrad)" stroke="#BA7517" stroke-width="1.5"/>

  <!-- Phase 1 -->
  <rect x="55" y="415" width="230" height="80" rx="6" fill="#0e1318" stroke="#6a8aaa" stroke-width="1"/>
  <text x="170" y="438" text-anchor="middle" fill="#dce8f5" font-size="12" font-weight="600">Phase 1: Deterministic</text>
  <text x="170" y="456" text-anchor="middle" fill="#6a8aaa" font-size="10">Zero LLM cost, 100% accurate</text>
  <text x="170" y="473" text-anchor="middle" fill="#6a8aaa" font-size="10">Tools, files, commands, errors</text>
  <text x="170" y="488" text-anchor="middle" fill="#1D9E75" font-size="10">→ Transcript condenser</text>

  <!-- Phase 2 -->
  <rect x="315" y="415" width="230" height="80" rx="6" fill="#0e1318" stroke="#6a8aaa" stroke-width="1"/>
  <text x="430" y="438" text-anchor="middle" fill="#dce8f5" font-size="12" font-weight="600">Phase 2: LLM Semantic</text>
  <text x="430" y="456" text-anchor="middle" fill="#6a8aaa" font-size="10">Your API key, your model</text>
  <text x="430" y="473" text-anchor="middle" fill="#6a8aaa" font-size="10">Bugs, patterns, playbooks</text>
  <text x="430" y="488" text-anchor="middle" fill="#1D9E75" font-size="10">→ Tiered model selection</text>

  <!-- Arrow between phases -->
  <line x1="285" y1="455" x2="315" y2="455" stroke="#6a8aaa" stroke-width="1"/>
  <polygon points="312,451 312,459 318,455" fill="#6a8aaa"/>

  <!-- Model tier -->
  <rect x="575" y="415" width="240" height="80" rx="6" fill="#0e1318" stroke="#6a8aaa" stroke-width="1"/>
  <text x="695" y="438" text-anchor="middle" fill="#dce8f5" font-size="12" font-weight="600">Model Tier System</text>
  <text x="695" y="456" text-anchor="middle" fill="#6a8aaa" font-size="10">Auto-detects API keys</text>
  <text x="695" y="473" text-anchor="middle" fill="#6a8aaa" font-size="10">Anthropic / Google / OpenAI</text>
  <text x="695" y="488" text-anchor="middle" fill="#6a8aaa" font-size="10">AWS / Ollama (local)</text>

  <!-- Bottom row: storage + dashboard -->
  <rect x="55" y="515" width="360" height="70" rx="6" fill="#0e1318" stroke="#6a8aaa" stroke-width="1"/>
  <text x="235" y="540" text-anchor="middle" fill="#dce8f5" font-size="12" font-weight="600">SQLite + WAL</text>
  <text x="235" y="558" text-anchor="middle" fill="#6a8aaa" font-size="10">~/.kernora/echo.db — sessions, insights, trends</text>
  <text x="235" y="575" text-anchor="middle" fill="#6a8aaa" font-size="10">All data on-device. Zero cloud dependency.</text>

  <rect x="445" y="515" width="370" height="70" rx="6" fill="#0e1318" stroke="#6a8aaa" stroke-width="1"/>
  <text x="630" y="540" text-anchor="middle" fill="#dce8f5" font-size="12" font-weight="600">Dashboard + Notifications</text>
  <text x="630" y="558" text-anchor="middle" fill="#6a8aaa" font-size="10">Flask + HTMX at localhost:2742</text>
  <text x="630" y="575" text-anchor="middle" fill="#6a8aaa" font-size="10">Desktop notifications via launchd</text>

  <!-- Footer -->
  <text x="450" y="645" text-anchor="middle" fill="#6a8aaa" font-size="11">kernora.ai — Built by Mihir Choudhary</text>
  <text x="450" y="662" text-anchor="middle" fill="#4a6a7a" font-size="10">Zero bytes leave your device. You own everything.</text>
</svg>
